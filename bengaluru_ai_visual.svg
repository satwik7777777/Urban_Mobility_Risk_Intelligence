<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0d2438"/>
      <stop offset="45%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#020509"/>
    </radialGradient>

    <linearGradient id="roadGlowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="roadGlowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- faint city block grid, receding into the distance -->
  <g opacity="0.16" stroke="#3ec9e8" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="90"/>
    <line x1="0" y1="220" x2="1200" y2="180"/>
    <line x1="0" y1="330" x2="1200" y2="280"/>
    <line x1="0" y1="450" x2="1200" y2="400"/>
    <line x1="150" y1="0" x2="90" y2="900"/>
    <line x1="330" y1="0" x2="230" y2="900"/>
    <line x1="560" y1="0" x2="470" y2="900"/>
    <line x1="820" y1="0" x2="760" y2="900"/>
    <line x1="1050" y1="0" x2="1010" y2="900"/>
  </g>

  <!-- distant skyline silhouettes -->
  <g opacity="0.5" fill="#0a1c2c">
    <rect x="60" y="330" width="46" height="220"/>
    <rect x="120" y="290" width="30" height="260"/>
    <rect x="190" y="360" width="60" height="190"/>
    <rect x="900" y="300" width="40" height="250"/>
    <rect x="960" y="340" width="55" height="210"/>
    <rect x="1040" y="270" width="34" height="280"/>
    <rect x="1100" y="320" width="50" height="230"/>
  </g>
  <g opacity="0.35" fill="#12283c">
    <rect x="40" y="420" width="1120" height="4"/>
  </g>

  <!-- scattered window lights -->
  <g fill="#7dd3fc" opacity="0.55">
    <rect x="70" y="350" width="4" height="4"/>
    <rect x="80" y="365" width="4" height="4"/>
    <rect x="128" y="310" width="4" height="4"/>
    <rect x="200" y="390" width="4" height="4"/>
    <rect x="915" y="325" width="4" height="4"/>
    <rect x="975" y="360" width="4" height="4"/>
    <rect x="1050" y="300" width="4" height="4"/>
    <rect x="1115" y="345" width="4" height="4"/>
  </g>

  <!-- glowing road network converging toward a vanishing point -->
  <g filter="url(#blur1)" fill="none" stroke-linecap="round">
    <path d="M -50,900 C 300,650 500,520 640,470" stroke="url(#roadGlowCyan)" stroke-width="10"/>
    <path d="M -50,900 C 300,650 500,520 640,470" stroke="#a5f3fc" stroke-width="2" opacity="0.9"/>

    <path d="M 1250,880 C 900,640 700,510 645,468" stroke="url(#roadGlowPurple)" stroke-width="10"/>
    <path d="M 1250,880 C 900,640 700,510 645,468" stroke="#e9d5ff" stroke-width="2" opacity="0.85"/>

    <path d="M 200,900 C 420,660 560,530 638,472" stroke="url(#roadGlowCyan)" stroke-width="6" opacity="0.7"/>
    <path d="M 1000,900 C 820,660 700,540 648,474" stroke="url(#roadGlowPurple)" stroke-width="6" opacity="0.6"/>

    <path d="M 640,900 C 642,700 644,560 646,470" stroke="url(#roadGlowCyan)" stroke-width="5" opacity="0.5"/>
  </g>

  <!-- lane markings along the main roads -->
  <g stroke="#e0f7ff" stroke-width="2" stroke-dasharray="14 18" opacity="0.5">
    <path d="M -50,900 C 300,650 500,520 640,470" fill="none"/>
    <path d="M 1250,880 C 900,640 700,510 645,468" fill="none"/>
  </g>

  <!-- vanishing-point hub glow -->
  <circle cx="644" cy="471" r="120" fill="url(#hubGlow)" filter="url(#blur2)"/>
  <circle cx="644" cy="471" r="6" fill="#f0fdff"/>

  <!-- floating data / risk nodes -->
  <g>
    <circle cx="330" cy="640" r="5" fill="#f87171"/>
    <circle cx="330" cy="640" r="14" fill="#f87171" opacity="0.25"/>

    <circle cx="860" cy="600" r="5" fill="#fbbf24"/>
    <circle cx="860" cy="600" r="14" fill="#fbbf24" opacity="0.25"/>

    <circle cx="520" cy="560" r="4" fill="#4ade80"/>
    <circle cx="520" cy="560" r="11" fill="#4ade80" opacity="0.25"/>

    <circle cx="760" cy="530" r="4" fill="#67e8f9"/>
    <circle cx="760" cy="530" r="11" fill="#67e8f9" opacity="0.25"/>
  </g>

  <!-- subtle scanline / grid texture overlay -->
  <g opacity="0.06" stroke="#67e8f9">
    <line x1="0" y1="700" x2="1200" y2="700" stroke-width="1"/>
    <line x1="0" y1="780" x2="1200" y2="780" stroke-width="1"/>
    <line x1="0" y1="850" x2="1200" y2="850" stroke-width="1"/>
  </g>

  <!-- vignette -->
  <rect width="1200" height="900" fill="url(#bg)" opacity="0"/>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="900" fill="url(#vignette)"/>
</svg>
